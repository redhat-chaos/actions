name: Rebuild krkn-hub
description: Rebuilds krkn-hub images
inputs:
  QUAY_USER:
    description: Quay user
    required: true
  QUAY_TOKEN:
    description: Quay token
    required: true
  AUTOPUSH:
    description: Auto push token
    required: true
  COSIGN_PRIVATE_KEY:
    description: cosign private key (PEM) used to sign the pushed images
    required: true
  COSIGN_PASSWORD:
    description: password protecting the cosign private key
    required: true

runs:
  using: composite
  steps:
    - name: Checkout krkn-hub repo
      uses: actions/checkout@v3
      with:
        repository: krkn-chaos/krkn-hub
        path: krkn-hub
    - name: Free disk space
      shell: bash
      run: |
        sudo docker image prune -af
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
        df -h
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Login in quay
      uses: docker/login-action@v3
      with:
        registry: quay.io
        username: ${{ inputs.QUAY_USER }}
        password: ${{ inputs.QUAY_TOKEN }}
    - name: Add krknctl metadata to Dockerfiles
      shell: bash
      run: bash build.sh
      working-directory: ./krkn-hub
    - name: Build and push Docker images
      shell: bash
      working-directory: ./krkn-hub
      run: |
        pids=()
        for scenario in $(docker compose config --services); do
          IMAGE=$(docker compose config --format json | jq -r ".services[\"$scenario\"].image")
          DOCKERFILE=$(docker compose config --format json | jq -r ".services[\"$scenario\"].build.dockerfile")
          echo "Building $scenario -> $IMAGE (dockerfile: $DOCKERFILE)"
          # Capture the pushed digest at build time (anti-TOCTOU) so signing
          # binds to exactly these bytes rather than re-resolving the tag later.
          docker buildx build \
            --platform linux/amd64 \
            --push \
            --tag "$IMAGE" \
            --file "$DOCKERFILE" \
            --provenance=false \
            --metadata-file "meta-${scenario}.json" \
            . &
          pids+=($!)
        done
        failed=0
        for pid in "${pids[@]}"; do
          if ! wait "$pid"; then
            failed=1
          fi
        done
        exit $failed
    # Sign every rebuilt scenario image so krknctl / krkn-operator (via the
    # shared pkg/verify package) can verify it before running. This release-time
    # rebuild overwrites the krkn-hub tags with new digests, so it must re-sign
    # them; otherwise the live digests would be unsigned after a krkn release.
    # Sign by the build-time digest, key-based, --tlog-upload=false, to match
    # the ecosystem's offline verification policy (no Fulcio/Rekor).
    - name: Install cosign
      uses: sigstore/cosign-installer@v4.1.2
    - name: Sign krkn-hub images with cosign
      shell: bash
      working-directory: ./krkn-hub
      env:
        COSIGN_PRIVATE_KEY: ${{ inputs.COSIGN_PRIVATE_KEY }}
        COSIGN_PASSWORD: ${{ inputs.COSIGN_PASSWORD }}
      run: |
        set -euo pipefail
        cosign public-key --key env://COSIGN_PRIVATE_KEY > /tmp/cosign.pub
        for scenario in $(docker compose config --services); do
          IMAGE=$(docker compose config --format json | jq -r ".services[\"$scenario\"].image")
          DIGEST=$(jq -r '.["containerimage.digest"]' "meta-${scenario}.json")
          REF="${IMAGE%:*}@${DIGEST}"
          echo "Signing ${REF}"
          cosign sign --yes --tlog-upload=false --key env://COSIGN_PRIVATE_KEY "${REF}"
          cosign verify --insecure-ignore-tlog=true --key /tmp/cosign.pub "${REF}"
        done
    - name: Make push to Prow-Scripts
      uses: redhat-chaos/actions/prow-scripts@main
      with:
        AUTOPUSH: ${{ inputs.AUTOPUSH }}
