name: Rebuild krkn-hub
description: Rebuilds krkn-hub images
inputs:
  QUAY_USER:
    description: Quay user
    required: true
  QUAY_TOKEN:
    description: Quay token
    required: true
  AUTOPUSH:
    description: Auto push token
    required: true

runs:
  using: composite
  steps:
    - name: Checkout krkn-hub repo
      uses: actions/checkout@v3
      with:
        repository: krkn-chaos/krkn-hub
        path: krkn-hub
    - name: Free disk space
      shell: bash
      run: |
        sudo docker image prune -af
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
        df -h
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Login in quay
      uses: docker/login-action@v3
      with:
        registry: quay.io
        username: ${{ inputs.QUAY_USER }}
        password: ${{ inputs.QUAY_TOKEN }}
    - name: Add krknctl metadata to Dockerfiles
      shell: bash
      run: bash build.sh
      working-directory: ./krkn-hub
    - name: Build and push Docker images
      shell: bash
      working-directory: ./krkn-hub
      run: |
        pids=()
        for scenario in $(docker compose config --services); do
          IMAGE=$(docker compose config --format json | jq -r ".services[\"$scenario\"].image")
          DOCKERFILE=$(docker compose config --format json | jq -r ".services[\"$scenario\"].build.dockerfile")
          echo "Building $scenario -> $IMAGE (dockerfile: $DOCKERFILE)"
          docker buildx build \
            --platform linux/amd64 \
            --push \
            --tag "$IMAGE" \
            --file "$DOCKERFILE" \
            --provenance=false \
            . &
          pids+=($!)
        done
        failed=0
        for pid in "${pids[@]}"; do
          if ! wait "$pid"; then
            failed=1
          fi
        done
        exit $failed
    - name: Make push to Prow-Scripts
      uses: redhat-chaos/actions/prow-scripts@main
      with:
        AUTOPUSH: ${{ inputs.AUTOPUSH }}
