name: Rebuild krkn-hub
description: Rebuilds krkn-hub images
inputs:
  QUAY_USER:
    description: Quay user
    required: true
  QUAY_TOKEN:
    description: Quay token
    required: true
  AUTOPUSH:
    description: Auto push token
    required: true
  COSIGN_PRIVATE_KEY:
    description: cosign private key (PEM) used to sign the pushed images
    required: true
  COSIGN_PASSWORD:
    description: password protecting the cosign private key
    required: true

runs:
  using: composite
  steps:
    - name: Checkout krkn-hub repo
      uses: actions/checkout@v3
      with:
        repository: krkn-chaos/krkn-hub
        path: krkn-hub
    - name: Free disk space
      shell: bash
      run: |
        sudo docker image prune -af
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
        df -h
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Login in quay
      uses: docker/login-action@v3
      with:
        registry: quay.io
        username: ${{ inputs.QUAY_USER }}
        password: ${{ inputs.QUAY_TOKEN }}
    - name: Add krknctl metadata to Dockerfiles
      shell: bash
      run: bash build.sh
      working-directory: ./krkn-hub
    - name: Build and push Docker images
      shell: bash
      working-directory: ./krkn-hub
      run: |
        pids=()
        for scenario in $(docker compose config --services); do
          IMAGE=$(docker compose config --format json | jq -r ".services[\"$scenario\"].image")
          DOCKERFILE=$(docker compose config --format json | jq -r ".services[\"$scenario\"].build.dockerfile")
          echo "Building $scenario -> $IMAGE (dockerfile: $DOCKERFILE)"
          # Capture the pushed digest at build time (anti-TOCTOU) so signing
          # binds to exactly these bytes rather than re-resolving the tag later.
          docker buildx build \
            --platform linux/amd64 \
            --push \
            --tag "$IMAGE" \
            --file "$DOCKERFILE" \
            --provenance=false \
            --metadata-file "meta-${scenario}.json" \
            . &
          pids+=($!)
        done
        failed=0
        for pid in "${pids[@]}"; do
          if ! wait "$pid"; then
            failed=1
          fi
        done
        exit $failed
    # Sign every rebuilt scenario image so krknctl / krkn-operator (via the
    # shared pkg/verify package) can verify it before running. This release-time
    # rebuild overwrites the krkn-hub tags with new digests, so it must re-sign
    # them; otherwise the live digests would be unsigned after a krkn release.
    # Sign by the build-time digest, key-based, with a no-transparency-log
    # signing-config, to match the ecosystem's offline verification policy
    # (no Fulcio/Rekor/TSA). cosign 2.6+ (installer v4.x) deprecated
    # --tlog-upload and made --tlog-upload=false incompatible with its
    # signing-config flow, so we pass a signing-config whose tlog/timestamp
    # services are stripped. It is vendored alongside this action
    # (signing-config.json) rather than fetched at run time, so a moved/removed
    # upstream file can't break signing.
    - name: Install cosign
      uses: sigstore/cosign-installer@v4.1.2
    - name: Sign krkn-hub images with cosign
      shell: bash
      working-directory: ./krkn-hub
      env:
        COSIGN_PRIVATE_KEY: ${{ inputs.COSIGN_PRIVATE_KEY }}
        COSIGN_PASSWORD: ${{ inputs.COSIGN_PASSWORD }}
      run: |
        set -euo pipefail
        cosign public-key --key env://COSIGN_PRIVATE_KEY > /tmp/cosign.pub
        for scenario in $(docker compose config --services); do
          IMAGE=$(docker compose config --format json | jq -r ".services[\"$scenario\"].image")
          DIGEST=$(jq -r '.["containerimage.digest"]' "meta-${scenario}.json")
          REF="${IMAGE%:*}@${DIGEST}"
          echo "Signing ${REF}"
          cosign sign --yes --signing-config "${{ github.action_path }}/signing-config.json" --key env://COSIGN_PRIVATE_KEY "${REF}"
          cosign verify --insecure-ignore-tlog=true --key /tmp/cosign.pub "${REF}"
        done
    # The images above are amd64-only and live under quay.io/krkn-chaos/krkn-hub.
    # krkn-hub's own CI also publishes multi-arch (amd64+arm64) variants under a
    # parallel quay.io/krkn-chaos/krkn-hub-multiarch repo. This release-time
    # rebuild must refresh those too, otherwise the multiarch tags stay pinned to
    # the previous krkn base after a release. Mirror krkn-hub's build-multiarch
    # job: map krkn-hub: -> krkn-hub-multiarch: and skip images that aren't under
    # krkn-hub (e.g. cerberus, which stays amd64-only). Built sequentially, not in
    # parallel like the amd64 loop above, because arm64 is emulated via QEMU and
    # running every scenario at once would exhaust the runner's disk/memory.
    - name: Build and push multi-arch Docker images
      shell: bash
      working-directory: ./krkn-hub
      run: |
        set -euo pipefail
        for scenario in $(docker compose config --services); do
          IMAGE=$(docker compose config --format json | jq -r ".services[\"$scenario\"].image")
          DOCKERFILE=$(docker compose config --format json | jq -r ".services[\"$scenario\"].build.dockerfile")
          case "$IMAGE" in
            */krkn-hub:*) MULTIARCH_IMAGE="${IMAGE/\/krkn-hub://krkn-hub-multiarch:}" ;;
            *) echo "Skipping multi-arch build for $scenario ($IMAGE)"; continue ;;
          esac
          echo "Building $scenario -> $MULTIARCH_IMAGE (dockerfile: $DOCKERFILE)"
          # Capture the pushed manifest-list digest at build time (anti-TOCTOU) so
          # signing binds to exactly these bytes rather than re-resolving the tag.
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            --tag "$MULTIARCH_IMAGE" \
            --file "$DOCKERFILE" \
            --provenance=false \
            --metadata-file "meta-multiarch-${scenario}.json" \
            .
        done
    # Sign the multi-arch scenario images by their manifest-list digest, same
    # key-based no-transparency-log policy as the amd64 signing step above.
    - name: Sign multi-arch krkn-hub images with cosign
      shell: bash
      working-directory: ./krkn-hub
      env:
        COSIGN_PRIVATE_KEY: ${{ inputs.COSIGN_PRIVATE_KEY }}
        COSIGN_PASSWORD: ${{ inputs.COSIGN_PASSWORD }}
      run: |
        set -euo pipefail
        cosign public-key --key env://COSIGN_PRIVATE_KEY > /tmp/cosign.pub
        for scenario in $(docker compose config --services); do
          IMAGE=$(docker compose config --format json | jq -r ".services[\"$scenario\"].image")
          case "$IMAGE" in
            */krkn-hub:*) MULTIARCH_IMAGE="${IMAGE/\/krkn-hub://krkn-hub-multiarch:}" ;;
            *) continue ;;
          esac
          DIGEST=$(jq -r '.["containerimage.digest"]' "meta-multiarch-${scenario}.json")
          REF="${MULTIARCH_IMAGE%:*}@${DIGEST}"
          echo "Signing ${REF}"
          cosign sign --yes --signing-config "${{ github.action_path }}/signing-config.json" --key env://COSIGN_PRIVATE_KEY "${REF}"
          cosign verify --insecure-ignore-tlog=true --key /tmp/cosign.pub "${REF}"
        done
    - name: Make push to Prow-Scripts
      uses: redhat-chaos/actions/prow-scripts@main
      with:
        AUTOPUSH: ${{ inputs.AUTOPUSH }}
